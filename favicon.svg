<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#090d14"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#1f2738" stroke-width="3"/>
  <!-- Top and Bottom Reticle Guide Lines -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="44" x2="56" y2="44" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top Notch Tick -->
  <line x1="28" y1="20" x2="28" y2="28" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom Notch Tick -->
  <line x1="28" y1="44" x2="28" y2="36" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
  <!-- Focal Letter Marker -->
  <circle cx="28" cy="32" r="5" fill="#ff3b30"/>
  <!-- Surrounding word letter dots -->
  <circle cx="16" cy="32" r="3" fill="#94a3b8"/>
  <circle cx="40" cy="32" r="3" fill="#f8fafc"/>
  <circle cx="48" cy="32" r="3" fill="#f8fafc"/>
</svg>
